name: Unrolled
options:
  bundleIdPrefix: dev.rahier
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
fileGroups:
  - Unrolled/Resources/Localizable.xcstrings
  - Unrolled/Resources/InfoPlist.xcstrings
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    # Disable explicit module builds — with TCA 1.25+ the CasePaths /
    # Perception transitive modules fail to resolve in the testability
    # build variant on Xcode 26 simulator SDKs.
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"
targets:
  Unrolled:
    type: application
    platform: iOS
    sources:
      - Unrolled
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
    info:
      path: Unrolled/Info.plist
      properties:
        CFBundleDisplayName: Unrolled
        # Substituted from build settings (MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION below) so a version bump in project.yml
        # is the single source of truth — no more drift between the
        # plist and what ships.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Unrolled needs access to your photos so you can swipe through and sort them."
    settings:
      base:
        # Bundle ID matches the brand. Must also be registered as an
        # explicit App ID in the Apple Developer Portal AND attached to
        # the App Store Connect listing — both are looked up at archive
        # time. Don't change without aligning all three.
        PRODUCT_BUNDLE_IDENTIFIER: dev.rahier.unrolled
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
  UnrolledTests:
    type: bundle.unit-test
    platform: iOS
    # Sources compiled directly into the test target instead of depending
    # on the main app — avoids the `Unrolled.debug.dylib` build step that
    # fails to link TCA's transitive SPM packages (CasePathsCore,
    # PerceptionCore) on recent Xcode/TCA combos. The reducer + its
    # models/clients are pure Swift value types with no UIKit/Photos
    # coupling that would break when compiled as a test bundle, except
    # for the live PhotoLibraryClient which tests never reach anyway.
    sources:
      - UnrolledTests
      - Unrolled/Features/SwipeFeature.swift
      - Unrolled/Models
      - Unrolled/Clients
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rahier.unrolled.tests
        GENERATE_INFOPLIST_FILE: YES
