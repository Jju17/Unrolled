name: PicSwipe
options:
  bundleIdPrefix: dev.rahier
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"
targets:
  PicSwipe:
    type: application
    platform: iOS
    sources:
      - PicSwipe
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
    info:
      path: PicSwipe/Info.plist
      properties:
        CFBundleDisplayName: PicSwipe
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "PicSwipe needs access to your photos so you can swipe through and sort them."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rahier.picswipe
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
